
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Event Registration</h1>
        <p>Join an event at our university.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <h2>Registration Form</h2>

        <p>
            Fill out the form below to register
            for your preferred university event.
        </p>

        <form id="registrationForm">

            <label for="name">Full Name:</label>
            <br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <br>

            <label for="studentid">Student ID:</label>
            <br>
            <input type="text" id="studentid" name="studentid"
                   placeholder="Enter your student ID" required>

            <br>

            <label for="email">Email Address:</label>
            <br>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com" required>

            <br>

            <label for="phone">Phone Number:</label>
            <br>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number"
                   pattern="[0-9+ -]{7,20}" required>

            <br>

            <label for="department">Department:</label>
            <br>
            <select id="department" name="department" required>
                <option value="">Select your department</option>
                <option>CSE</option>
                <option>EEE</option>
                <option>Business Administration</option>
                <option>English</option>
                <option>Law</option>
                <option>Other</option>
            </select>

            <br>

            <label for="gender">Gender:</label>
            <br>
            <select id="gender" name="gender" required>
                <option value="">Select your gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Prefer not to say</option>
            </select>

            <br>

            <label for="event">Choose an Event:</label>
            <br>
            <select id="event" name="event" required>
                <option value="">Select an event</option>
                <option>Tech Seminar</option>
                <option>Programming Contest</option>
                <option>Cultural Festival</option>
            </select>

            <br>

            <label for="message">Additional Message:</label>
            <br>
            <textarea id="message" name="message"
                      rows="4"
                      placeholder="Write your message here..."></textarea>

            <br>

            <button type="submit">Register</button>
            <button type="reset">Reset</button>

        </form>

        <p id="registrationMessage" class="message"
           style="display:none;"></p>

    </main>

    <footer>
        <p>&copy; 2026 EventHub. All Rights Reserved.</p>
    </footer>

</body>
</html>
